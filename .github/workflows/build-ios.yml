name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build"
        required: true
        default: "1.0.7-cluster"
      runner:
        description: "macOS runner label"
        required: true
        default: "macos-15-intel"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Build llama.cpp for iOS
        run: |
          command -v ninja || brew install ninja
          command -v cmake || brew install cmake
          bash local_plugins/llama_flutter_android/scripts/build_llama_ios.sh
          ls -lh local_plugins/llama_flutter_android/ios/llama_ios/lib

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          NAME="PrivateLM-${{ inputs.ref }}-unsigned.ipa"
          zip -qry "$NAME" Payload
          ls -lh "$NAME"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-iOS-${{ inputs.ref }}
          path: ${{ env.IPA_NAME }}

      - name: Publish as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ inputs.ref }}
          name: PrivateLM iOS ${{ inputs.ref }} (unsigned)
          body: Unsigned IPA built from tag ${{ inputs.ref }}. Sign and install with AltStore, AltServer or Sideloadly.
          files: ${{ env.IPA_NAME }}
          target_commitish: ${{ github.sha }}
